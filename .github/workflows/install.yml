
name: Unpack Autopilot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q makerworld_autopilot_v2.zip
          cp -R makerworld_autopilot_v2/. .
          rm -rf makerworld_autopilot_v2
          rm makerworld_autopilot_v2.zip

      - name: Commit extracted files
        env:
          GH_TOKEN: ${{ secrets.MW_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/jwiens30-hub/markerworld-autopilot-.git"
          git add -A
          git commit -m "Install MakerWorld Autopilot"
          git push origin HEAD:main

