name: Unpack Autopilot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q makerworld_autopilot_v2.zip
          cp -R makerworld_autopilot_v2/. .
          rm -rf makerworld_autopilot_v2
          rm makerworld_autopilot_v2.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install MakerWorld Autopilot"
          git push
